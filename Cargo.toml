[package]
name = "soulseek-proto"
description = "The Soulseek wire protocol: message codecs, framing and data model"
version = "0.3.0"
edition = "2024"
# the library's; its tests need 1.88, the oldest Rust proptest builds with
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reseek-rs/soulseek-proto"
readme = "README.md"
keywords = ["soulseek", "protocol", "p2p", "codec", "file-sharing"]
categories = ["network-programming", "encoding", "parser-implementations"]
include = ["/src/", "/README.md", "/LICENSE*"]

[dependencies]
flate2 = "1"
md-5 = "0.11"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
proptest-derive = "0.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
